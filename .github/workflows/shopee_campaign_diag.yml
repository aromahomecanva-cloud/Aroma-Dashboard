name: Shopee campaign diag

# Bấm tay (Actions > Shopee campaign diag > Run workflow): thử API Shopee Ads cấp campaign/sản phẩm, in kết quả ra log.
on:
  workflow_dispatch: {}

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Gọi thử API campaign
        run: python shopee_campaign_diag.py
        env:
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
      - name: Gọi thử API GMS / shop-level
        run: python shopee_gms_diag.py
        env:
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
      - name: Lưu token mới (nếu đã refresh)
        if: always()
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add shopee_tokens.json
          git diff --staged --quiet || (git commit -m "Shopee: cập nhật token sau refresh" && git pull --rebase origin main && git push)
